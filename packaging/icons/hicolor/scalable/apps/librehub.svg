<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- LibreHub: angular gaming mouse, white outline, accent side buttons -->
  <defs>
    <linearGradient id="shellD" x1="0.25" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#464d56"/>
      <stop offset="0.42" stop-color="#181b20"/>
      <stop offset="1" stop-color="#060709"/>
    </linearGradient>
  </defs>

  <!-- angular shell: pinched nose, flared palm, tapered tail -->
  <path d="M64 8
           C51 8 42 15 39 27
           L34 50
           C31 65 31 82 35 96
           C39 110 51 119 64 119
           C77 119 89 110 93 96
           C97 82 97 65 94 50
           L89 27
           C86 15 77 8 64 8 Z"
        fill="url(#shellD)" stroke="#ffffff" stroke-width="5.5"
        stroke-linejoin="round"/>

  <!-- palm divide, angled like a gaming shell seam -->
  <path d="M33.5 56 H94.5" stroke="#ffffff" stroke-width="5"
        stroke-linecap="round"/>
  <path d="M64 10 V56" stroke="#ffffff" stroke-width="5"
        stroke-linecap="round"/>

  <!-- scroll wheel -->
  <rect x="58.5" y="20" width="11" height="26" rx="5.5"
        fill="#d9dee4" stroke="#ffffff" stroke-width="3"/>

  <!-- the two side buttons, lit in the brand accent -->
  <rect x="35" y="64" width="15" height="11" rx="4" fill="#17916b"
        stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <rect x="35" y="81" width="15" height="11" rx="4" fill="#17916b"
        stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
</svg>
