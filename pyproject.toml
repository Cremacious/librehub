[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "librehub"
version = "1.0.0"
description = "Per-game mouse-button remapper for Linux — the open answer to G HUB's per-game feature"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["evdev>=1.6"]

[project.scripts]
librehub = "librehub.gui:main"
librehub-daemon = "librehub.daemon:main"
librehub-tray = "librehub.tray:main"
librehub-doctor = "librehub.preflight:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.hatch.build.targets.wheel]
packages = ["librehub"]
